    <style>
        /* ============================
           VARIABLES Y RESET OPTIMIZADO
           ============================ */
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-dark: #1b5e20;
            --primary-gradient: linear-gradient(135deg, #0d1f0d 0%, #1b5e20 40%, #2e7d32 100%);
            --gold: #ffb300;
            --gold-light: #ffd54f;
            --dark: #0d1f0d;
            --gray: #555;
            --gray-light: #f0f0f0;
            --light-bg: #f7faf7;
            --white: #ffffff;
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 35px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 25px 70px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--light-bg);
            color: var(--dark);
            padding-bottom: 130px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        img {
            max-width: 100%;
            display: block;
            height: auto;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============================
           LOADING SCREEN
           ============================ */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader p {
            margin-top: 16px;
            color: var(--primary);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================
           HEADER
           ============================ */
        .site-header {
            background: var(--white);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 0;
            border-bottom: 2px solid var(--primary);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-brand .logo-icon {
            font-size: 1.8rem;
        }
        .header-brand h1 {
            font-size: 1.1rem;
            color: var(--primary-dark);
            font-weight: 800;
            line-height: 1.2;
        }
        .header-brand h1 span {
            color: var(--gold);
        }
        .header-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-nav a {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dark);
            transition: var(--transition);
            padding: 4px 0;
            position: relative;
        }
        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
        }
        .header-nav a:hover::after {
            width: 100%;
        }
        .header-nav a:hover {
            color: var(--primary);
        }
        .header-whatsapp {
            background: #25d366;
            color: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .header-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        @media (max-width: 650px) {
            .header-inner {
                flex-direction: column;
                text-align: center;
            }
            .header-nav {
                justify-content: center;
            }
            .header-brand h1 {
                font-size: 1rem;
            }
        }
        @media (max-width: 420px) {
            .header-nav a {
                font-size: 0.7rem;
            }
            .header-whatsapp {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
        }

        /* ============================
           HERO SECTION - INTRODUCCIÓN DE ASTRID
           ============================ */
        .hero {
            background: var(--primary-gradient);
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .hero::before {
            content: '🌿';
            position: absolute;
            font-size: 250px;
            right: -40px;
            bottom: -80px;
            opacity: 0.05;
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -20%;
            width: 70%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(255, 179, 0, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;
            position: relative;
            z-index: 2;
        }
        .hero-text {
            color: var(--white);
        }
        .hero-text .subtitle {
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }
        .hero-text h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .hero-text p strong {
            color: var(--gold-light);
        }
        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--gold);
            color: var(--dark);
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 179, 0, 0.3);
        }
        .btn-secondary {
            border: 2px solid var(--white);
            color: var(--white);
        }
        .btn-secondary:hover {

background: var(--white);
color: var(--primary-dark);
transform: translateY(-2px);
}
.hero-image-wrapper {
display: flex;
justify-content: center;
align-items: center;
}
.hero-image {
width: 100%;
max-width: 420px;
border-radius: 24px;
border: 4px solid rgba(255, 255, 255, 0.15);
box-shadow: var(--shadow-lg);
object-fit: cover;
aspect-ratio: 1 / 1;
}
@media (max-width: 900px) {
.hero {
padding: 40px 20px;
}
.hero-container {
grid-template-columns: 1fr;
text-align: center;
gap: 30px;
}
.hero-text h1 {
font-size: 2rem;
}
.hero-buttons {
justify-content: center;
}
.hero-image {
max-width: 320px;
}
}

NUEVAS SECCIONES: BIOHACKING Y MARCA BLANCA
========================================== */

}

.grid-2 {

}
.section-tag {

letter-spacing: 1px;

}
.brand-section .section-tag {

}
.bio-title {

font-weight: 800;
}
.brand-title {
font-size: 2.2rem;

margin-bottom: 20px;

}
.bio-text, .brand-text {
font-size: 1.05rem;
line-height: 1.7;
margin-bottom: 25px;
color: var(--gray);
}
.brand-text {
color: rgba(255, 255, 255, 0.9);
}
.brand-text strong {

}
.product-highlight-card {
background: var(--light-bg);
border: 2px solid var(--primary-light);
border-radius: var(--radius);
padding: 30px;
box-shadow: var(--shadow-md);
text-align: center;
}
.product-highlight-card h3 {

}
.price-tag {

}
.btn-brand-action {
background: var(--gold);
color: var(--dark);
padding: 14px 30px;
border-radius: 50px;
font-weight: 700;
display: inline-flex;
align-items: center;
gap: 10px;
box-shadow: var(--shadow-sm);
transition: var(--transition);
}
.btn-brand-action:hover {
background: var(--gold-light);
transform: translateY(-3px);
box-shadow: 0 10px 25px rgba(255, 179, 0, 0.4);
}
@media (max-width: 768px) {
.grid-2 {
grid-template-columns: 1fr;
text-align: center;
}
.product-highlight-card {
max-width: 400px;
margin: 0 auto;
}
.bio-title, .brand-title {
font-size: 1.8rem;
}
}
